server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The AI fun-fact endpoint only exists in the Vite dev server. Fail fast here
    # so the app falls back to its built-in fun facts (no API key needed in prod).
    location /api/ {
        return 404;
    }

    # Single-page-app fallback: route everything else to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
